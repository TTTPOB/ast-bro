name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release --locked
      - name: Lint all targets
        run: cargo clippy --all-targets --locked -- --deny warnings
      - name: Run tests
        run: cargo test --locked -- --skip go_module_prefix_strips_correctly
      - name: Package Linux binaries
        run: |
          tar -C target/release -czf target/ast-bro-linux-x86_64.tar.gz ast-bro ast-outline sb
          sha256sum target/ast-bro-linux-x86_64.tar.gz > target/ast-bro-linux-x86_64.tar.gz.sha256
      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: ast-bro-linux-x86_64
          path: |
            target/ast-bro-linux-x86_64.tar.gz
            target/ast-bro-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
