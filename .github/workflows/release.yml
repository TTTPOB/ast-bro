name: Release

on:
  push:
    tags:
      - "*-r"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify R support branch
        run: |
          git fetch origin feat/r-language-support:refs/remotes/origin/feat/r-language-support
          git merge-base --is-ancestor "$GITHUB_SHA" origin/feat/r-language-support
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release --locked
      - name: Lint all targets
        run: cargo clippy --all-targets --locked -- --deny warnings
      - name: Run tests
        run: cargo test --locked -- --skip go_module_prefix_strips_correctly
      - name: Package Linux binaries
        run: |
          archive="ast-bro-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          tar -C target/release -czf "target/${archive}" ast-bro ast-outline sb
          pushd target
          sha256sum "${archive}" > "${archive}.sha256"
          popd
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="target/ast-bro-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          checksum="${archive}.sha256"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$archive" "$checksum" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" \
              "${archive}#Linux x86_64 binaries" \
              "${checksum}#SHA-256 checksum" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "ast-bro ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
